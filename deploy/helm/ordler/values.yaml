# Ordler needs only PostgreSQL 18+ with an empty database; it creates its tables itself.
#
# Two ways to give it the database:
# 1. Set `database.host` below (recommended for Kubernetes, allows several replicas).
# 2. Leave it empty: Ordler shows an install page asking for the connection and keeps it in
#    a persistent volume. That mode runs a single replica.

image:
  repository: ghcr.io/elkhan-isayev/ordler
  # Defaults to the chart appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Public URL people open, e.g. https://tasks.company.com.
baseUrl: http://localhost:3000

replicaCount: 1

database:
  # Empty: use the install page instead (single replica, needs persistence).
  host: ''
  port: 5432
  name: ordler
  user: ordler
  # Password in plain values, or reference an existing Secret below.
  password: ''
  existingSecret: ''
  existingSecretKey: password
  # disable | require | verify-full (verify-full recommended for AWS RDS).
  ssl: disable
  # CA bundle (PEM) for verify-full, e.g. the AWS RDS global bundle.
  sslCa: ''
  # Empty: `public` for new installs; installs created before 0.3 keep using `ordler`.
  schema: ''
  poolMax: 20

# Key that encrypts stored secrets (SMTP, Google, database password). Generated once and kept
# in a Secret when empty; set existingSecret to manage it yourself. Back it up.
encryptionKey:
  existingSecret: ''
  existingSecretKey: encryption-key

# Optional fixed token for the install page (otherwise printed in the pod log).
installToken: ''

# Holds install-page settings; required when database.host is empty.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ''
  accessMode: ReadWriteOnce
  existingClaim: ''

# Daily anonymous check of GitHub releases for the admin update banner.
updateCheck:
  enabled: true

# Extra environment variables, e.g. SMTP_* (mail can also be set in the admin panel).
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: tasks.company.com
  tls: []
  #  - secretName: ordler-tls
  #    hosts: [tasks.company.com]
  # When `annotations` above put Ordler behind an authenticating proxy (e.g. ingress-nginx
  # auth-url to oauth2-proxy), enable this: a second Ingress for the same host, class and TLS
  # that serves only the paths whose callers bring their own token or signature (MCP clients,
  # REST API scripts, Slack, GitHub), so the proxy does not send them to a sign-in page.
  # Ordler checks the credentials on each of these paths itself.
  bypassAuth:
    enabled: false
    # Annotations for this Ingress only; repeat the non-auth ones you need, e.g. timeouts.
    annotations: {}
    paths:
      - { path: /mcp, pathType: Prefix } # MCP endpoint, bearer tokens
      - { path: /api/v1, pathType: Prefix } # REST API, bearer tokens
      - { path: /.well-known/oauth-protected-resource, pathType: Prefix } # MCP OAuth metadata
      - { path: /.well-known/oauth-authorization-server, pathType: Exact }
      - { path: /api/oauth/token, pathType: Exact } # OAuth token exchange
      - { path: /api/oauth/register, pathType: Exact } # OAuth client registration
      - { path: /api/slack, pathType: Prefix } # Slack events and interactivity (signed)
      - { path: /api/github/webhook, pathType: Exact } # GitHub webhook (HMAC-signed)

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

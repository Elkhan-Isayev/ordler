{{- $name := include "ordler.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $needKey := not .Values.encryptionKey.existingSecret -}}
{{- $needDbPassword := and .Values.database.host (not .Values.database.existingSecret) .Values.database.password -}}
{{- if or $needKey $needDbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ordler.labels" . | nindent 4 }}
  annotations:
    # Keep the generated encryption key when the release is deleted: losing it loses secrets.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $needKey }}
  {{- if and $existing (index $existing.data "encryption-key") }}
  encryption-key: {{ index $existing.data "encryption-key" }}
  {{- else }}
  encryption-key: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- end }}
  {{- end }}
  {{- if $needDbPassword }}
  password: {{ .Values.database.password | b64enc }}
  {{- end }}
{{- end }}
